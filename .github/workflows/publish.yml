name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Create plugin zip
        run: |
          set -euo pipefail
          pkg=logseq-google-drive-graph-sync
          rm -rf "$pkg" "$pkg.zip"
          mkdir -p "$pkg"
          cp -r dist "$pkg/"
          cp package.json README.md icon.svg LICENSE "$pkg/"
          zip -r "$pkg.zip" "$pkg"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: logseq-google-drive-graph-sync.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
